[package]
name = "trace_block"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Transparent live tracer for AI coding-agent JSON event streams (pi --mode json, Claude Code stream-json): TUI, trajectory export, Mermaid diagrams"
license = "MIT"
repository = "https://github.com/king0980692/trace_block"
readme = "README.md"
keywords = ["agent", "llm", "trace", "tui", "claude"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = ["fixtures/", ".github/"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ctrlc = "3.5.2"
icy_sixel = "0.7.0"
libc = "0.2.189"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
png = "0.18.1"
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"

[dev-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
